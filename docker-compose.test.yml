# QR Menü — test override compose.
#
# Brings up a separate postgres for pytest runs, so dev DB stays clean.
# Tests use SQLite in-memory (config.settings.test), so this file is here
# mainly as a scaffold for future Sprint 2+ tests that need a real PG
# (e.g. JSONField quirks, full-text search).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d postgres-test
#   docker compose -f docker-compose.test.yml run --rm backend-test pytest

name: qrmenu-test

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: qrmenu-postgres-test
    environment:
      POSTGRES_DB: qr_menu_test
      POSTGRES_USER: qr_menu_test
      POSTGRES_PASSWORD: qr_menu_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qr_menu_test -d qr_menu_test"]
      interval: 5s
      timeout: 5s
      retries: 10
