<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <title>QR Menü — Giriş Yap</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1c1917;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color:#f5f5f4;padding:32px 16px;">
        <tr>
            <td align="center">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width:560px;background-color:#ffffff;border-radius:12px;overflow:hidden;">
                    <tr>
                        <td style="padding:32px 32px 16px 32px;text-align:center;">
                            <span style="display:inline-block;font-size:24px;font-weight:700;color:#0c0a09;">QR Menü</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0 32px 24px 32px;font-size:16px;line-height:24px;color:#44403c;">
                            <p style="margin:0 0 16px 0;">Merhaba,</p>
                            <p style="margin:0 0 24px 0;">
                                Hesabınıza giriş yapmak için aşağıdaki butona tıklayın.
                                Bağlantı <strong>{{ ttl_minutes }} dakika</strong> boyunca geçerlidir.
                            </p>
                            <p style="margin:0 0 24px 0;text-align:center;">
                                <a href="{{ verify_url }}"
                                   style="display:inline-block;background-color:#0c0a09;color:#ffffff;
                                          text-decoration:none;padding:12px 24px;border-radius:8px;
                                          font-weight:600;font-size:15px;">
                                    Giriş Yap
                                </a>
                            </p>
                            <p style="margin:0 0 8px 0;font-size:13px;color:#78716c;">
                                Buton çalışmazsa bu bağlantıyı tarayıcınıza yapıştırın:
                            </p>
                            <p style="margin:0;font-size:13px;word-break:break-all;color:#2563eb;">
                                <a href="{{ verify_url }}" style="color:#2563eb;text-decoration:underline;">{{ verify_url }}</a>
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:24px 32px;border-top:1px solid #e7e5e4;font-size:12px;color:#a8a29e;text-align:center;">
                            Siz talep etmediyseniz bu mesajı görmezden gelebilirsiniz.
                            <br />QR Menü &middot; Güvenli giriş
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
