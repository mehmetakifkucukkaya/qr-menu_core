# ============================================================================
# .github/workflows/ci.yml — the release gate, on every push and pull request.
#
# Why this file exists: the repo had 1184 backend tests, 20 frontend unit
# suites and 41 browser flows — and nothing ran them automatically. The
# first audit found a release where every one of those checks was green
# while the admin could not create a product and the customers could not
# place an order. The gate only exists if it runs.
#
# What it runs (scripts/release_gate.sh):
#   1. backend test suite              (pytest — 1207 passed, 2 skipped)
#   2. frontend type-check + lint      (tsc, next lint, e2e tsc)
#   3. frontend unit tests             (22 suites)
#   4. production env file check       (skipped without .env.production)
#   5. browser smoke tests, 7 flows    (Playwright against a production build)
#
# The browser flows are the expensive part (they build the app and start
# Django), so they run on every push and every pull request. If that
# becomes the bottleneck, split them into their own job — but do not turn
# them off: they are the only checks that look at a running site.
#
# The gate has already paid for itself: its first full run caught the
# signup submit race (D-040) that had been hiding behind a passing
# single-file run.
# ============================================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    # "edited" is here on purpose: it fires when the PR's base branch
    # changes. Without it, retargeting a PR to a different base leaves the
    # old check in place — the run that passed against the old base is
    # reported as the PR's status, and nothing verifies the new one.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate:
    name: Release gate (backend + frontend + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # --- Backend ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install the backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      # --- Frontend --------------------------------------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the frontend dependencies
        working-directory: apps/web
        run: npm ci

      # --- The gate --------------------------------------------------------
      # Runs everything in one go so a failure points at the same place a
      # developer would run it locally: bash scripts/release_gate.sh.
      # The browser flows need the Playwright Chromium build.
      - name: Install the Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run the release gate
        env:
          # The gate's Playwright harness builds its own stack on
          # throwaway ports; CI must never reuse a running server.
          CI: "1"
        run: bash scripts/release_gate.sh
